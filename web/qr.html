<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>手机扫码打开</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    img {
      max-width: min(320px, 90vw);
      border-radius: 12px;
      background: #fff;
      padding: 12px;
    }
    p { color: #94a3b8; line-height: 1.6; }
    a { color: #60a5fa; }
  </style>
</head>
<body>
  <h1>手机扫码打开</h1>
  <p>用系统相机或微信扫一扫，扫完后在浏览器打开链接</p>
  <p><img src="/qr.png" alt="二维码" width="280" height="280" /></p>
  <p>打开后请 <strong>添加到主屏幕</strong>，以后一点图标即可进入</p>
  <p><a href="/">返回发送页</a></p>
</body>
</html>
